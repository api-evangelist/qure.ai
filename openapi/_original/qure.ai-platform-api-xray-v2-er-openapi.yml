openapi: 3.0.3
info:
  title: Qure Platform APIs
  description: >-
    Qure.ai is a state-of-the-art artificial intelligence platform that provides
    healthcare imaging solutions to help medical professionals make faster and
    more accurate diagnoses. The Qure Platform APIs offer a programmatic
    interface for partners to upgrade medical imaging systems with Qure’s AI
    diagnostic tools.
  version: 3.1.33
servers:
- url: BASE_URL
  description: >-
    The BASE_URL is the root address for all your API requests. You must append
    this to all requests to the Platform API. To obtain
    this, contact support@qure.ai.
components:
  securitySchemes:
    TokenAuth:
      type: apiKey
      in: header
      name: Authorization
  headers:
    SourceHeader:
      description: User identification is done through the `Source` header.
      required: true
      schema:
        type: string
      example: "<PASTE_YOUR_SOURCE>"
    ContentTypeHeader:
      description: >-
        Indicates the media type of the resource, used primarily for POST, PUT,
        and PATCH requests with a payload.
      required: true
      schema:
        type: string
      example: "multipart/form-data"
x-hideTryItPanel: true
x-codeSamples: true
paths:
  /studies:
    post:
      summary: Upload DICOMs.
      operationId: uploadDicoms
      tags:
        - Upload DICOMs
      requestBody:
        required: true
        description: Contains the DICOMs to be uploaded.
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file0:
                  type: string
                  format: binary
                  description: The first DICOM file to be uploaded.
                file1:
                  type: string
                  format: binary
                  description: The second DICOM file to be uploaded.
                file2:
                  type: string
                  format: binary
                  description: The third DICOM file to be uploaded.
      x-codeSamples:
        - lang: cURL
          label: cURL
          source: |
            curl -X POST \\
            -L 'Base_URL/studies/' \\
            -H 'Content-Type: multipart/form-data' \\
            -H 'Authorization: Token <PASTE_YOUR_TOKEN>' \\
            -H 'Source: <PASTE_YOUR_SOURCE>' \\
            -F 'file_1=@"</path/to/your/dicom_file1.dcm>"' \\
            -F 'file_2=@"</path/to/your/dicom_file2.dcm>"' \\
            -F 'file_3=@"</path/to/your/dicom_file3.dcm>"'
        - lang: Python
          label: Python
          source: |
            import requests

            url = "Base_URL/studies/"

            # Prepare the files for upload. Assign each file a unique key.
            files = {
                'file_0': ('<dicom_file1.dcm>', open('<path/to/dicom_file1.dcm>', 'rb'), 'application/dicom'),
                'file_1': ('<dicom_file2.dcm>', open('<path/to/dicom_file2.dcm>', 'rb'), 'application/dicom'),
                'file_2': ('<dicom_file3.dcm>', open('<path/to/dicom_file3.dcm>', 'rb'), 'application/dicom')
            }

            # Headers, including the Authorization token and Source
            headers = {
                'Authorization': 'Token <PASTE_YOUR_TOKEN>',
                'Source': '<PASTE_YOUR_SOURCE>',
                'Content-Type': 'multipart/form-data'
            }

            # Perform the POST request
            response = requests.post(url, headers=headers, files=files)

            # Print the response text
            print(response.text)

            # Close the file handles after the request is done
            for file in files.values():
                file[1].close()
      responses:
        '200':
          description: DICOMS uploaded successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: A message that validates the upload request based on the response status code. 
                    example: Success
                  status:
                    type: string
                    example: success
                  messages:
                    type: object
                    description: Contains information about the uploaded files along with their metadata.
                    properties:
                      file0:
                        type: object
                        properties:
                          message:
                            type: string
                            example: DICOM registered successfully.
                          created:
                            type: boolean
                          license_expired:
                            type: boolean
                          metadata:
                            type: object
                      file1:
                        type: object
                        properties:
                          message:
                            type: string
                            example: DICOM registered successfully.
                          created:
                            type: boolean
                          license_expired:
                            type: boolean
                          metadata:
                            type: object
                      file2:
                        type: object
                        properties:
                          message:
                            type: string
                            example: DICOM registered successfully.
                          created:
                            type: boolean
                          license_expired:
                            type: boolean
                          metadata:
                            type: object
                  series_instance_uids:
                    type: array
                    description: A list of SeriesInstanceUIDs present in the uploaded files.
                    items:
                      type: string
                  detailed_info:
                    description: An object that contains detailed information about the uploaded DICOMs.
                    type: array
                    items:
                      type: object
                      properties:
                        SeriesInstanceUID:
                          type: string
                          description: It is a unique identifier  given for a series of DICOM images.
                        NumberOfSeriesRelatedInstances:
                          type: number
                          description: It is the number of series instance UIDs that belong to a set of series.
        '400':
          description: Use case not implemented or no DICOMs uploaded
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: A message that validates the upload request based on the response status code.
                    example: Invalid token header. No credentials provided.
                  next:
                    type: string
                    description: Inidcates the next step to resolve the issue.
                    example: /accounts/login/
                  authenticated:
                    type: boolean
                    description: Indicates the token validity.
                    example: true
        '401':
          description: Invalid token header
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: A message that validates the upload request based on the response status code.
                    example: No DICOM files were uploaded!
  /compute/{SeriesInstanceUID}:
    get:
      summary: Initiate Computation.
      operationId: initiateComputation
      tags:
        - Initiate Computation
      parameters:
        - in: path
          name: SeriesInstanceUID
          required: true
          schema:
            type: string
          description: The unique identifier for the series to initiate computation on.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                recompute:
                  type: boolean
      x-codeSamples:
        - lang: cURL
          label: cURL
          source: |
            curl -X GET \\
            -L 'Base_URL/compute/<SeriesInstanceUID>' \\
            -H 'Authorization: Token <PASTE_YOUR_TOKEN>' \\
            -H 'Source: <PASTE_YOUR_SOURCE>'
        - lang: Python
          label: Python
          source: |
            import requests
            import pydicom

            # To fetch SeriesInstanceUID using pydicom 

            series_instance_uid = pydicom.read_file('<path/to/your/dicom_file.dcm>').SeriesInstanceUID

            url = f"Base_URL/compute/{series_instance_uid}"

            # Headers, including the Authorization token and Source
            headers = {
                'Authorization': 'Token <PASTE_YOUR_TOKEN>',
                'Source': '<PASTE_YOUR_SOURCE>',
            }
            # Perform the GET request
            response = requests.get(url, headers=headers)

            # Print the response text
            print(response.text)
      responses:
        '200':
          description: Computation initiated successfully
          content: 
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: A message that validates the request based on the response status code.
                    example: series_instance_uid successfully pushed for computation!
                  success:
                    type: boolean
                    example: true
        '304':
          description: The DICOMS are already pushed for computation.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: A message that validates the request based on the response status code.
                    example: series_instance_uid was already pushed for computation!
                  success:
                    type: boolean
                    example: true
        '401':
          description: The Authorization header has either no token or a wrong token.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: A message that validates the request based on the response status code.
                    example: Invalid token header. No credentials provided.
                  next:
                    type: string
                    description: Inidcates the next step to resolve the issue.
                    example: /accounts/login/
                  authenticated:
                    type: boolean
                    description: Indicates the token validity.
                    example: false
        '403':
          description: The Source header is either no source or the wrong source.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    description: A message that validates the request based on the response status code.
                    example: Access denied!
        '404':
          description: The requested image or series could not be found, possibly because it has not been uploaded yet.
          content:
            application/json:
              schema:
                type: object
                properties:
                  sucess:
                    type: boolean
                    example: false
                  message:
                    type: string
                    description: A message that validates the upload request based on the response status code.
                    example: Resource with SeriesInstanceUID <SeriesInstanceUID> is not yet uploaded!
  /results/{SOPInstanceUID}:
    get:
      summary: DEPRECATED - Fetch Results v1 (for X-Rays).
      operationId: fetchResultsXRay
      tags:
        - Fetch Results
      parameters:
        - in: path
          name: SOPInstanceUID
          required: true
          schema:
            type: string
          description: The unique identifier for a specific instance of a service object pair (SOP), such as a single x-ray, to fetch results for.
      x-codeSamples:
        - lang: cURL
          label: cURL
          source: |
            curl -X GET \\
            -L 'Base_URL/results/<SOPInstanceUID>' \\
            -H 'Authorization: Token <PASTE_YOUR_TOKEN>' \\
            -H 'Source: <PASTE_YOUR_SOURCE>'
        - lang: Python
          label: Python
          source: |
            import requests
            import pydicom

            # To fetch sopInstanceUID using pydicom 

            sop_instance_uid = pydicom.read_file('<path/to/your/dicom_file.dcm>').SOPInstanceUID

            url = f"Base_URL/results/{sop_instance_uid}"
            
            # Headers, including the Authorization token and Source
            headers = {
                'Authorization': 'Token <PASTE_YOUR_TOKEN>',
                'Source': '<PASTE_YOUR_SOURCE>',
            }

              # Perform the GET request
              response = requests.get(url, headers=headers)

              # Print the response text
              print(response.text) 
      responses:
        '200':
          description: Results fetched successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    description: A message that validates the request based on the response status code.
                    example: "Results retrieved successfully!"
                  triage_status:
                    type: string
                    description: Indicates the urgency of results.'Critical' for high priority needing immediate expert review, and 'Routine' for standard priority also requiring expert supervision.
                    example: "critical"
                  result:
                    type: object
                    description: Contains the results for the uploaded DICOMs.
                    properties:
                      report:
                        type: object
                        properties:
                          findings:
                            type: string
                            example: <findings_text>\\n\\n<additional_findings_text>\\n\\n<more_findings_text>
                          impression:
                            type: string
                            example: "Abnormal study"
                          findings_list:
                            type: array
                            description: An array of arrays, where each inner array consists of two elements - a report key and its related findings text. The report key is a unique identifier for a specific finding, and the findings text provides detailed information about that finding, including any additional notes or observations, separated by new lines for clarity.
                            items:
                              type: array
                              items:
                                report_key:
                                  type: string
                                  description: The report key, a unique identifier for the finding.
                                  example: "example_report_key"
                                findings_text:
                                  type: string
                                  description: The related findings text, detailing the observations associated with the report key.
                                  example: "example_findings_text\n\n"
                      files:
                        type: object
                        description: Contains the reports and their related asset URLs.
                        properties:
                          sc:
                            type: array
                            items:
                              type: string
                              example: <https://exampleurl.com>
                          sc_full_png:
                            type: array
                            items:
                              type: string
                              example: <https://exampleurl.com>
                          sc_thumbnail:
                            type: array
                            items:
                              type: string
                              example: <https://exampleurl.com>
                          sc_dicom_thumbnail:
                            type: array
                            items:
                              type: string
                              example: <https://exampleurl.com>
                          original_thumbnail:
                            type: array
                            items:
                              type: string
                              example: <https://exampleurl.com>
                          original:
                            type: array
                            items:
                              type: string
                              example: <https://exampleurl.com>
                          report_pdf:
                            type: array
                            items:
                              type: string
                              example: <https://exampleurl.com>
                          report_dcm:
                            type: array
                            items:
                              type: string
                              example: <https://exampleurl.com>
                          report_sr:
                            type: array
                            items:
                              type: string
                              example: <https://exampleurl.com>
                  usecase:
                    type: string
                    description: Describes the usecase.
                    example: "qxr"
        '202':
          description: The request has been accepted for processing, but the processing is not complete. It's common when predictions or analysis are still underway.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    description: A message that validates the request based on the response status code.
                    example: Resource with sopInstanceUID <SOPInstanceUID> is under process. Please check back in some time.
        '401':
          description: The Authorization header has either no token or a wrong token.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: A message that validates the request based on the response status code.
                    example: Invalid token header. No credentials provided.
                  next:
                    type: string
                    description: Inidcates the next step to resolve the issue.
                    example: /accounts/login/
                  authenticated:
                    type: boolean
                    description: Indicates the token validity.
                    example: false
        '403':
          description: The Source header is either no source or the wrong source.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    description: A message that validates the request based on the response status code.
                    example: Access denied!
        '404':
          description: The requested image or series could not be found, possibly because it has not been uploaded yet.
          content:
            application/json:
              schema:
                type: object
                properties:
                  sucess:
                    type: boolean
                    example: false
                  message:
                    type: string
                    description: A message that validates the request based on the response status code.
                    example: Resource with SeriesInstanceUID <SeriesInstanceUID> is not yet uploaded!
        '400':
          description: Returned when there's an unsupported use case, such as uploading an unsupported modality.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    description: A message that validates the request based on the response status code.
                    example: Use case not implemented.
                  seriesInstanceUID:
                    type: string
                    description: It is a unique identifier  given for a series of DICOM images.
                    example: <series_instance_uid>
                  accessionNumber:
                    type: string
                    example: <accession_number>
                  debug_info:
                    type: object
                    properties:
                      reason:
                        type: string
                        example: Validity not determined yet!
                  result:
                    type: object
        '409':
          description: Returned when the Series is not yet invoked for computation.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: Series with resource_uidseries_instance_uid has not yet been invoked for computation. You can invoke by doing a GET on base_url/compute/series_instance_uid.
  /results/v2/{SOPInstanceUID}:
    get:
      summary: Fetch Results v2 (for X-Rays).
      operationId: fetchResultsv2XRay
      tags:
        - Fetch Results
      parameters:
        - in: path
          name: SOPInstanceUID
          required: true
          schema:
            type: string
          description: The unique identifier for a specific instance of a service object pair (SOP), such as a single x-ray, to fetch results for.
      x-codeSamples:
        - lang: cURL
          label: cURL
          source: |
            curl -X GET \\
            -L 'Base_URL/results/v2/<SOPInstanceUID>' \\
            -H 'Authorization: Token <PASTE_YOUR_TOKEN>' \\
            -H 'Source: <PASTE_YOUR_SOURCE>'
        - lang: Python
          label: Python
          source: |
            import requests
            import pydicom

            # To fetch sopInstanceUID using pydicom 

            sop_instance_uid = pydicom.read_file('<path/to/your/dicom_file.dcm>').SOPInstanceUID

            url = f"Base_URL/results/v2/{sop_instance_uid}"
            
            # Headers, including the Authorization token and Source
            headers = {
                'Authorization': 'Token <PASTE_YOUR_TOKEN>',
                'Source': '<PASTE_YOUR_SOURCE>',
            }

              # Perform the GET request
              response = requests.get(url, headers=headers)

              # Print the response text
              print(response.text) 
      responses:
        '200':
          description: Results fetched successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    description: Deprecated and shouldn't be used for anything. This is always true generally when present. Maintained for backwards compatibility.
                    example: true
                  message:
                    type: string
                    description: A human readable message that validates the request based on the response status code.
                    example: "Results retrieved successfully!"
                  triage_status:
                    type: string
                    description: An Enum indicating the urgency of results. Either one of `Critical` or `Routine`, where `Routine` indicates that the AI detected no abnormality in the scan, and `Critical` indicates that the AI has detected an abnormality.
                    example: "Critical"
                  result:
                    type: object
                    description: Contains the results for the uploaded DICOMs.
                    properties:
                      report:
                        type: object
                        properties:
                          findings:
                            type: string
                            description: A free text report describing the AI results.
                            example: <findings_text>\\n\\n<additional_findings_text>\\n\\n<more_findings_text>
                          impression:
                            type: string
                            description: Generally used as a single summary.
                            example: "Abnormal study"
                          findings_list:
                            type: array
                            description: An array of arrays, where each inner array consists of two elements - a report key and its related findings text. The report key is a unique identifier for a specific finding, and the findings text provides detailed information about that finding, including any additional notes or observations, separated by new lines for clarity.
                            items:
                              type: array
                              items:
                                report_key:
                                  type: string
                                  description: The report key, a unique identifier for the finding.
                                  example: "example_report_key"
                                findings_text:
                                  type: string
                                  description: The related findings text, detailing the observations associated with the report key.
                                  example: "example_findings_text\n\n"
                      files:
                        type: object
                        description: Contains the reports and their related asset URLs. Each asset has a set of URLs which should downloaded for the full result. The assets(SC, SR, PDF etc.) can differ based on you configuration. Every enables asset must be returned.
                        properties:
                          sc:
                            type: array
                            items:
                              type: string
                              example: <https://exampleurl.com>
                          sc_full_png:
                            type: array
                            items:
                              type: string
                              example: <https://exampleurl.com>
                          sc_thumbnail:
                            type: array
                            items:
                              type: string
                              example: <https://exampleurl.com>
                          sc_dicom_thumbnail:
                            type: array
                            items:
                              type: string
                              example: <https://exampleurl.com>
                          original_thumbnail:
                            type: array
                            items:
                              type: string
                              example: <https://exampleurl.com>
                          original:
                            type: array
                            items:
                              type: string
                              example: <https://exampleurl.com>
                          report_pdf:
                            type: array
                            items:
                              type: string
                              example: <https://exampleurl.com>
                          report_dcm:
                            type: array
                            items:
                              type: string
                              example: <https://exampleurl.com>
                          report_sr:
                            type: array
                            items:
                              type: string
                              example: <https://exampleurl.com>
                  usecase:
                    type: string
                    description: Describes the usecase.
                    example: "qxr"
        '202':
          description: The request has been accepted for processing, but the processing is not complete. It's common when predictions or analysis are still underway.
          content:
            application/json:
              schema:
                type: object
                properties:
                  reason:
                    type: string
                    description: A message that validates the request based on the response status code.
                    example: processing not started
        '206':
          description: A 206 status code is returned when the uploaded DICOM is detected as a valid X-ray modality, but the scan is invalid. In such cases, generated assets (e.g., SC, SR) accompany the response and explicitly state that the DICOM is invalid. These assets ensure consistency with normal processing flows.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    description: Deprecated and shouldn't be used for anything. This is always true generally when present. Maintained for backwards compatibility.
                    example: true
                  message:
                    type: string
                    description: A human readable message that validates the request based on the response status code.
                    example: "Results retrieved successfully!"
                  triage_status:
                    type: string
                    description: An Enum indicating the urgency of results. Either one of `Critical` or `Routine`, where `Routine` indicates that the AI detected no abnormality in the scan, and `Critical` indicates that the AI has detected an abnormality.
                    example: "Routine"
                  result:
                    type: object
                    description: Contains the results for the uploaded DICOMs.
                    properties:
                      report:
                        type: object
                        properties:
                          findings:
                            type: string
                            description: A free text report describing the AI results.
                            example: "Invalid X-Ray"
                          impression:
                            type: string
                            description: Generally used as a single summary.
                            example: "Uploaded Invalid X-RAY"
                          findings_list:
                            type: array
                            description: An array of arrays, where each inner array consists of two elements - a report key and its related findings text. The report key is a unique identifier for a specific finding, and the findings text provides detailed information about that finding, including any additional notes or observations, separated by new lines for clarity.
                      files:
                        type: object
                        description: Contains the reports and their related asset URLs. Each asset has a set of URLs which should downloaded for the full result. The assets(SC, SR, PDF etc.) can differ based on you configuration. Every enables asset must be returned.
                        properties:
                          sc:
                            type: array
                            items:
                              type: string
                              example: <https://exampleurl.com>
                          sc_full_png:
                            type: array
                            items:
                              type: string
                              example: <https://exampleurl.com>
                          sc_thumbnail:
                            type: array
                            items:
                              type: string
                              example: <https://exampleurl.com>
                          sc_dicom_thumbnail:
                            type: array
                            items:
                              type: string
                              example: <https://exampleurl.com>
                          original_thumbnail:
                            type: array
                            items:
                              type: string
                              example: <https://exampleurl.com>
                          original:
                            type: array
                            items:
                              type: string
                              example: <https://exampleurl.com>
                          report_pdf:
                            type: array
                            items:
                              type: string
                              example: <https://exampleurl.com>
                          report_dcm:
                            type: array
                            items:
                              type: string
                              example: <https://exampleurl.com>
                          report_sr:
                            type: array
                            items:
                              type: string
                              example: <https://exampleurl.com>
                  usecase:
                    type: string
                    description: Describes the usecase.
                    example: "not_implemented"
        '400':
          description: This response indicates that the DICOM uploaded is of an unsupported modality or the AI has detected that the scan uploaded is invalid.
          content:
            text/plain:
              schema:
                type: string
                example: "not implemented"
        '401':
          description: The Authorization header has either no token or a wrong token.
        '403':
          description: This response is given when the `Source`  header is missing, incorrect, or when you requested results for a DICOM that doesn't belong to your workspace.
          content:
            text/plain:
              schema:
                type: string
                example: "Forbidden"
        '404':
          description: The result is not found because the corresponding DICOM or series is missing, possibly because it has not been uploaded yet.
        '500':
          description: This response occurs when an unknown Qure.ai system failure occurs.
        '502':
          description: This indicates that the request failed because the server is down, unresponsive, or unable to communicate with the upstream server, preventing a valid response.
  /results/{SeriesInstanceUID}:
    get:
          summary: Fetch Results(for qER).
          operationId: fetchResultsqER
          tags:
            - Fetch Results
          parameters:
            - in: path
              name: SeriesInstanceUID
              required: true
              schema:
                type: string
              description: The unique identifier for the series to fetch results for.
          x-codeSamples:
            - lang: cURL
              label: cURL
              source: |
                curl -X GET \\
                -L 'Base_URL/results/<SeriesInstanceUID>' \\
                -H 'Authorization: Token <PASTE_YOUR_TOKEN>' \\
                -H 'Source: <PASTE_YOUR_SOURCE>'
            - lang: Python
              label: Python
              source: |
                import requests
                import pydicom

                # To fetch SeriesInstanceUID using pydicom 

                series_instance_uid = pydicom.read_file('<path/to/your/dicom_file.dcm>').SeriesInstanceUID

                url = f"Base_URL/results/{series_instance_uid}"
                
                # Headers, including the Authorization token and Source
                headers = {
                    'Authorization': 'Token <PASTE_YOUR_TOKEN>',
                    'Source': '<PASTE_YOUR_SOURCE>',
                }

                  # Perform the GET request
                  response = requests.get(url, headers=headers)

                  # Print the response text
                  print(response.text) 
          responses:
            '200':
              description: Results fetched successfully
              content:
                application/json:
                  schema:
                    type: object
                    description: For qER
                    properties:
                      success:
                        type: boolean
                        example: true
                      message:
                        type: string
                        description: A message that validates the request based on the response status code.
                        example: "Results retrieved successfully!"
                      triage_status:
                        type: string
                        description: Indicates the urgency of results.'Critical' for high priority needing immediate expert review, and 'Routine' for standard priority also requiring expert supervision.
                        example: "critical"
                      result:
                        type: object
                        properties:
                          report:
                            type: array
                            items:
                              type: string
                            description: List of findings
                            example:
                              - "Finding 1"
                              - "Finding 2"
                              - "Finding 3"
                          scores:
                            type: object
                            additionalProperties:
                              type: number
                            description: Scores for each pathology
                            example:
                              PATHOLOGY_1: score
                              PATHOLOGY_2: score
                              PATHOLOGY_n: score
                          decisions:
                            type: object
                            additionalProperties:
                              type: boolean
                            description: Decisions for each pathology based on the scores and their respective thresholds.
                            example:
                              PATHOLOGY_1: true
                              PATHOLOGY_2: false
                              PATHOLOGY_n: true
                          reporting_params:
                            type: array
                            items:
                              type: string
                            description: Parameters used for reporting
                            example: []
                          qure_model_version:
                            type: string
                            description: Version of the Qure model used
                            example: "Latest"
                          files:
                            type: object
                            description: Contains the reports and their related asset URLs.
                            properties:
                              sc:
                                type: array
                                items:
                                  type: string
                                  example: <https://exampleurl.com>
                              sc_full_png:
                                type: array
                                items:
                                  type: string
                                  example: <https://exampleurl.com>
                              sc_thumbnail:
                                type: array
                                items:
                                  type: string
                                  example: <https://exampleurl.com>
                              sc_dicom_thumbnail:
                                type: array
                                items:
                                  type: string
                                  example: <https://exampleurl.com>
                              original_thumbnail:
                                type: array
                                items:
                                  type: string
                                  example: <https://exampleurl.com>
                              original:
                                type: array
                                items:
                                  type: string
                                  example: <https://exampleurl.com>
                              report_pdf:
                                type: array
                                items:
                                  type: string
                                  example: <https://exampleurl.com>
                              report_dcm:
                                type: array
                                items:
                                  type: string
                                  example: <https://exampleurl.com>
                              report_sr:
                                type: array
                                items:
                                  type: string
                                  example: <https://exampleurl.com>
                      usecase:
                        type: string
                        description: Describes the usecase.
                        example: "qer"
            '202':
              description: The request has been accepted for processing, but the processing is not complete. It's common when predictions or analysis are still underway.
              content:
                application/json:
                  schema:
                    type: object
                    properties:
                      success:
                        type: boolean
                        example: false
                      message:
                        type: string
                        description: A message that validates the request based on the response status code.
                        example: Resource with sopInstanceUID <SOPInstanceUID> is under process. Please check back in some time.
            '401':
              description: The Authorization header has either no token or a wrong token.
              content:
                application/json:
                  schema:
                    type: object
                    properties:
                      message:
                        type: string
                        description: A message that validates the request based on the response status code.
                        example: Invalid token header. No credentials provided.
                      next:
                        type: string
                        description: Inidcates the next step to resolve the issue.
                        example: /accounts/login/
                      authenticated:
                        type: boolean
                        description: Indicates the token validity.
                        example: false
            '403':
              description: The Source header is either no source or the wrong source.
              content:
                application/json:
                  schema:
                    type: object
                    properties:
                      success:
                        type: boolean
                        example: false
                      message:
                        type: string
                        description: A message that validates the request based on the response status code.
                        example: Access denied!
            '404':
              description: The requested image or series could not be found, possibly because it has not been uploaded yet.
              content:
                application/json:
                  schema:
                    type: object
                    properties:
                      sucess:
                        type: boolean
                        example: false
                      message:
                        type: string
                        description: A message that validates the request based on the response status code.
                        example: Resource with SeriesInstanceUID <SeriesInstanceUID> is not yet uploaded!
            '400':
              description: Returned when there's an unsupported use case, such as uploading an unsupported modality.
              content:
                application/json:
                  schema:
                    type: object
                    properties:
                      success:
                        type: boolean
                        example: false
                      message:
                        type: string
                        description: A message that validates the request based on the response status code.
                        example: Use case not implemented.
                      seriesInstanceUID:
                        type: string
                        description: It is a unique identifier  given for a series of DICOM images.
                        example: <series_instance_uid>
                      accessionNumber:
                        type: string
                        example: <accession_number>
                      debug_info:
                        type: object
                        properties:
                          reason:
                            type: string
                            example: Validity not determined yet!
                      result:
                        type: object
            '409':
              description: Returned when the Series is not yet invoked for computation.
              content:
                application/json:
                  schema:
                    type: object
                    properties:
                      success:
                        type: boolean
                        example: false
                      message:
                        type: string
                        example: Series with resource_uidseries_instance_uid has not yet been invoked for computation. You can invoke by doing a GET on base_url/compute/series_instance_uid.
security:
  - TokenAuth: []
