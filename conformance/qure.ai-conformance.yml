  - id: dicom
    conforms: true
    evidence: >-
      DOMAIN STANDARD. The entire contract is DICOM-native: POST /studies accepts
      application/dicom payloads, and every read operation is keyed on a DICOM
      identifier (SOPInstanceUID for instances, SeriesInstanceUID for series).
      Dedicated DICOM Specifications pages are published per product (qXR, qMSK,
      qCT, qER). Outputs are returned as DICOM Secondary Capture (SC) and
      Structured Report (SR) assets.
    spec_location: >-
      openapi/qure.ai-platform-api-xray-v2-er-openapi.yml#/paths/~1studies/post
      (Content-Type application/dicom) and the SOPInstanceUID / SeriesInstanceUID
      path parameters on every /results and /compute operation
