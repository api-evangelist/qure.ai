apis:
- aid: qure.ai:platform-api
  name: Qure.ai Platform API
  description: The Qure Platform API is a token-authenticated REST interface that lets partners send DICOM medical
    images to Qure.ai deep-learning models and retrieve AI triage results. Upload chest or musculoskeletal X-rays
    and head or chest CT series to POST /studies (or POST /upload), invoke inference for CT series with GET /compute/{SeriesInstanceUID},
    then poll GET /results/v2/{SOPInstanceUID} for qXR/qMSK or GET /results/{SeriesInstanceUID} for qER and qCT.
    Responses carry a Critical/Routine triage status, a narrative findings report and generated DICOM Secondary
    Capture and Structured Report assets. Identity is DICOM-native — SOPInstanceUID and SeriesInstanceUID are the
    only resource keys.
