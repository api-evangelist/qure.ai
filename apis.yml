aid: qure.ai
name: Qure.ai
description: Qure.ai is a healthcare artificial-intelligence company, founded in 2016 and headquartered in Mumbai,
  India, that builds regulator-cleared deep-learning software for medical imaging. Its products read chest X-rays
  (qXR), head and chest CT (qER, qCT), and musculoskeletal X-rays (qMSK) to detect, quantify and triage findings
  such as tuberculosis, lung nodules, intracranial hemorrhage, midline shift, cranial fracture, pneumothorax and
  pleural effusion, typically in under a minute. The company exposes these models to partners through the Qure Platform
  API, a token-authenticated DICOM ingest and results-retrieval REST interface documented at docs.qure.ai, alongside
  an on-premises Gateway deployment and the Qure.ai clinical app. Qure.ai holds multiple US FDA 510(k) clearances
  and EU MDR/MDD CE certifications and reports deployment across more than 85 countries.
