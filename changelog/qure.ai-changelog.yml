    current_version: 3.1.6
    entries:
      - version: 3.1.6
        date: '2023-05-08'
        breaking: false
        additions:
          - Automatic Routing and User Groups Management settings for the mobile application.
        fixes:
          - Mixed positive/negative results when filtering by tag.
          - Media attachments not viewable in forms.
          - Form summary not auto-updating in the patient channel.
