      - version: 1.0.22
        date: '2025-04-17'
        breaking: false
        additions:
          - Gateway log file retention raised from 1 MB to a configurable 10 MB default.
          - Support for connecting to an external PostgreSQL instance.
          - Automatic detection and restart of a terminated shared PostgreSQL instance.
      - version: 1.0.21
        date: '2024-10-18'
        breaking: false
        additions:
          - Configurable storage location for DICOM files (previously fixed to the C drive).
          - Metadata field swap/append configuration for DICOM files when used with the Qure App.
          - Active-page highlight in the Gateway UI.
        fixes:
          - Status page no longer errors when a DICOM is uploaded without Modality metadata.
          - Filewatcher no longer stops on non-DICOM files; only valid DICOM headers are uploaded.
      - version: 1.0.20
        date: '2024-08-09'
        breaking: false
        additions:
          - Qure Support contact details surfaced in the product.
